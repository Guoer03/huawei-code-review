[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-code-review"
version = "0.4.0"
description = "Deterministic Huawei and OpenHarmony code review CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Huawei Code Review contributors"},
]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
huawei-code-review = "scripts.check:main"
huawei-code-review-compare = "scripts.compare_reports:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "scripts.*", "adapters", "adapters.*", "rulesets"]

[tool.setuptools.package-data]
rulesets = ["catalog.json", "implementations/*.json"]
scripts = ["java_rules/*.java", "frontend_rules/*.cjs", "frontend_rules/*.mjs", "frontend_rules/*.js", "frontend_rules/*.json"]
